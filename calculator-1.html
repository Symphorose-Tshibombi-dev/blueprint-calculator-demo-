<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculator 01 — Quick Build</title><style>:root{--d:#123b5b;--dd:#082d49;--p:#fff8e9;--pink:#ee87d8;--lime:#b9e400;--yellow:#ffd929;--purple:#b59af3;--ink:#17222d}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:Arial,sans-serif;background:linear-gradient(135deg,var(--dd),var(--d))}.shell{min-height:100vh;padding:28px;display:flex;flex-direction:column;align-items:center}.top{width:min(1050px,96vw);display:flex;justify-content:space-between;align-items:center}.brand{font-size:13px;letter-spacing:2px}.back{color:#fff;text-decoration:none;border:2px dashed #fff;border-radius:999px;padding:10px 16px}h1{font-family:Georgia,serif;font-style:italic;font-size:clamp(45px,7vw,82px);margin:36px 0 6px;text-align:center}.sub{max-width:720px;text-align:center;line-height:1.5;font-size:18px}.calc{width:min(430px,94vw);background:var(--p);color:var(--ink);padding:24px;border-radius:36px;box-shadow:12px 12px 0 rgba(0,0,0,.22);margin:24px auto}.display{background:#20252a;color:#fff;border-radius:20px;padding:20px;min-height:88px;font:30px monospace;text-align:right;overflow:auto}.status{min-height:30px;margin:12px 4px;font-weight:700}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.keys button{font-size:21px;padding:17px 8px;border:0;border-radius:18px;background:#e8e1d3;cursor:pointer;font-weight:800}.keys .op{background:var(--purple)}.keys .eq{background:var(--lime)}.keys .bad{background:var(--pink)}.done{margin:15px;text-align:center}.done b{background:var(--yellow);color:#111;padding:6px 10px;border-radius:9px}</style></head><body><main class="shell"><div class="top"><div class="brand">CALCULATOR 01 • QUICK BUILD</div><a class="back" href="index.html">← BACK TO DEMOS</a></div><h1>It works... right?</h1><p class="sub">Start with normal numbers. Then test what happens when the user does something we never planned for.</p><div class="calc"><div id="display" class="display">0</div><div id="status" class="status">Ready.</div><div class="keys"><button onclick="add('7')">7</button><button onclick="add('8')">8</button><button onclick="add('9')">9</button><button class="op" onclick="add('/')">÷</button><button onclick="add('4')">4</button><button onclick="add('5')">5</button><button onclick="add('6')">6</button><button class="op" onclick="add('*')">×</button><button onclick="add('1')">1</button><button onclick="add('2')">2</button><button onclick="add('3')">3</button><button class="op bad" onclick="brokenPlus()">+</button><button onclick="add('0')">0</button><button onclick="add('.')">.</button><button class="eq" onclick="equals()">=</button><button class="op" onclick="add('-')">−</button><button class="bad" onclick="add('H')">H</button><button class="bad" onclick="add('$')">$</button><button class="bad" onclick="add('%')">%</button><button onclick="clearD()">C</button></div></div><div class="done">Try <b>H</b>, <b>%</b>, or the <b>+</b> button. Then compare Calculator 02.</div></main><script>let exp='';const d=()=>document.getElementById('display'),s=()=>document.getElementById('status');function render(){d().textContent=exp||'0'}function add(v){exp+=v;render();s().textContent='Input accepted.'}function clearD(){exp='';render();s().textContent='Cleared.'}function brokenPlus(){s().textContent="Hmm... the + button doesn't respond."}function equals(){if(/[A-Za-z$%]/.test(exp)){d().textContent=exp+' = ???';s().textContent='Unexpected input reached the calculator.';return}try{let r=Function('"use strict";return ('+exp+')')();d().textContent=String(r);exp=String(r);s().textContent='It calculated this one.'}catch(e){s().textContent='Something went wrong.'}}</script></body></html>
